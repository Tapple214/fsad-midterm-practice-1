{% extends "base.html" %}
{% block content %}
<h1>Event Form</h1>

<form method="post">
    {% csrf_token %}
    <input type="text" name="title" placeholder="Title" value="{{ event.title|default:'' }}" required>
    <textarea name="description" placeholder="Description">{{ event.description|default:'' }}</textarea>
    <input type="text" name="location" placeholder="Location" value="{{ event.location|default:'' }}" required>
    <input type="datetime-local" name="event_date" value="{{ event.event_date|date:'Y-m-d\TH:i' }}" required>
    <select name="category" required>
        {% for cat in categories %}
        <option value="{{ cat.id }}" {% if event.category_id == cat.id %}selected{% endif %}>{{ cat.name }}</option>
        {% endfor %}
    </select>
    <select name="status">
        <option value="upcoming" {% if event.status == "upcoming" %}selected{% endif %}>Upcoming</option>
        <option value="ongoing" {% if event.status == "ongoing" %}selected{% endif %}>Ongoing</option>
        <option value="finished" {% if event.status == "finished" %}selected{% endif %}>Finished</option>
    </select>
    <input type="number" name="capacity" placeholder="Capacity" value="{{ event.capacity|default:50 }}" required>
    <button type="submit">Save</button>
</form>
{% endblock %}
